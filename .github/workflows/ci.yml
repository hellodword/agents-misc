name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-misc-codex-config-atlas-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and check Atlas
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      NIX_IMAGE: docker.io/nixos/nix@sha256:53b5ec518b696373829ea305c3c07a8c870113e44648c88ec484ef078550fd4f

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflow, check Atlas, and export site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          site_dir="$RUNNER_TEMP/atlas-site"
          rm -rf -- "$site_dir"
          mkdir -p "$site_dir"
          host_uid="$(id -u)"
          host_gid="$(id -g)"
          nix_config="$(printf 'experimental-features = nix-command flakes\naccess-tokens = github.com=%s\n' "$GITHUB_TOKEN")"

          NIX_CONFIG="$nix_config" \
          HOST_UID="$host_uid" \
          HOST_GID="$host_gid" \
            docker run --rm -i \
              --ulimit nofile=65536:1048576 \
              --workdir /workspace \
              --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
              --mount "type=bind,source=$site_dir,target=/site" \
              --env NIX_CONFIG \
              --env NIX_USER_CONF_FILES=/tmp/nix.conf \
              --env HOST_UID \
              --env HOST_GID \
              "$NIX_IMAGE" \
              bash -euo pipefail <<'BASH'
          export PYTHONNOUSERSITE=1
          git config --global --add safe.directory /workspace
          cat > /tmp/nix.conf <<'CONFIG'
          experimental-features = nix-command flakes
          sandbox = false
          accept-flake-config = false
          cores = 0
          fallback = true
          max-substitution-jobs = 4
          http-connections = 8
          require-sigs = true
          CONFIG
          nix eval --no-update-lock-file --impure --raw --expr \
            '((builtins.getFlake "git+file:///workspace").inputs.core.lib.cache.mkCacheConfig { }).public.text' \
            >> /tmp/nix.conf
          nix develop --no-update-lock-file .#dev --command actionlint .github/workflows/ci.yml
          nix build --no-link --no-update-lock-file --print-build-logs \
            .#checks.x86_64-linux.formatting \
            .#checks.x86_64-linux.codex-config-atlas-registry \
            .#checks.x86_64-linux.codex-config-atlas-data \
            .#checks.x86_64-linux.codex-config-atlas-site \
            .#checks.x86_64-linux.codex-config-atlas-tests \
            .#codex-config-atlas-site
          site="$(nix build --no-link --no-update-lock-file --print-out-paths .#codex-config-atlas-site)"
          cp -RL "$site/." /site/
          chown -R "$HOST_UID:$HOST_GID" /site
          BASH

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/atlas-site

  deploy:
    name: Deploy Atlas
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
