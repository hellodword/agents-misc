name: build codex

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-misc-patch-codex
  cancel-in-progress: true

jobs:
  verify:
    name: Verify patched Codex
    runs-on: ubuntu-latest

    env:
      CACHIX_CACHE_NAME: hellodword-codex
      CACHIX_PUBLIC_KEY: hellodword-codex.cachix.org-1:0URmcnC9aynWh9+FJ2tf+HQloylGgZzPtrz3sttTTiQ=

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix
        with:
          nix_extra_substituters: |
            https://${{ env.CACHIX_CACHE_NAME }}.cachix.org
          nix_extra_trusted_public_keys: |
            ${{ env.CACHIX_PUBLIC_KEY }}

      - name: Run Codex checks
        shell: bash
        run: |
          set -euo pipefail
          nix build --accept-flake-config --no-link \
            .#checks.x86_64-linux.codex-patch-contract \
            .#checks.x86_64-linux.codex-behavior \
            .#checks.x86_64-linux.codex-generation \
            .#checks.x86_64-linux.codex-hooks \
            .#checks.x86_64-linux.github-workflows

  build:
    name: Build and push Cachix cache
    needs: verify
    runs-on: ubuntu-latest

    env:
      CACHIX_CACHE_NAME: hellodword-codex
      CACHIX_PUBLIC_KEY: hellodword-codex.cachix.org-1:0URmcnC9aynWh9+FJ2tf+HQloylGgZzPtrz3sttTTiQ=
      FLAKE_PACKAGE: .#codex

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix
        with:
          nix_extra_substituters: |
            https://${{ env.CACHIX_CACHE_NAME }}.cachix.org
          nix_extra_trusted_public_keys: |
            ${{ env.CACHIX_PUBLIC_KEY }}

      - name: Build package
        shell: bash
        run: |
          set -euxo pipefail
          nix build \
            --accept-flake-config \
            --no-link \
            --print-out-paths \
            "$FLAKE_PACKAGE" \
            | tee /tmp/nix-build-out-paths
          test -s /tmp/nix-build-out-paths

      - name: Push runtime closure to Cachix
        shell: bash
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euxo pipefail
          test -s /tmp/nix-build-out-paths
          cat /tmp/nix-build-out-paths \
            | nix shell nixpkgs#cachix -c cachix push "$CACHIX_CACHE_NAME"
