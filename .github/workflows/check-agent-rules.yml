name: check agent rules

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Agent Rules Kit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix

      - name: Run Agent Rules Kit checks
        shell: bash
        run: |
          set -euo pipefail
          nix build --no-link --no-write-lock-file --print-build-logs \
            .#checks.x86_64-linux.agent-rules
