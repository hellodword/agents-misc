name: Publish Codex Config Atlas

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-misc-codex-config-atlas-pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Codex Config Atlas
    runs-on: ubuntu-latest

    env:
      CACHIX_CACHE_NAME: hellodword-codex
      CACHIX_PUBLIC_KEY: hellodword-codex.cachix.org-1:0URmcnC9aynWh9+FJ2tf+HQloylGgZzPtrz3sttTTiQ=

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix
        with:
          nix_extra_substituters: |
            https://${{ env.CACHIX_CACHE_NAME }}.cachix.org
          nix_extra_trusted_public_keys: |
            ${{ env.CACHIX_PUBLIC_KEY }}

      - name: Run Atlas checks
        shell: bash
        run: |
          set -euo pipefail
          nix build --accept-flake-config --no-link \
            .#checks.x86_64-linux.codex-config-atlas-registry \
            .#checks.x86_64-linux.codex-config-atlas-data \
            .#checks.x86_64-linux.codex-config-atlas-site \
            .#checks.x86_64-linux.codex-config-atlas-tests \
            .#checks.x86_64-linux.github-workflows

  build:
    name: Build Codex Config Atlas site
    needs: verify
    runs-on: ubuntu-latest

    env:
      CACHIX_CACHE_NAME: hellodword-codex
      CACHIX_PUBLIC_KEY: hellodword-codex.cachix.org-1:0URmcnC9aynWh9+FJ2tf+HQloylGgZzPtrz3sttTTiQ=

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix
        with:
          nix_extra_substituters: |
            https://${{ env.CACHIX_CACHE_NAME }}.cachix.org
          nix_extra_trusted_public_keys: |
            ${{ env.CACHIX_PUBLIC_KEY }}

      - name: Build site
        run: nix build --accept-flake-config --out-link result .#codex-config-atlas-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: result

  deploy:
    name: Deploy Codex Config Atlas site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
